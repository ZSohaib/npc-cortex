[package]
name = "npc-cortex"
version = "0.1.0"
edition = "2021"
description = "Rust client for the npc-cortex HTTP bridge (Bevy, Fyrox, Bevy-free games)"
license = "MIT"

[dependencies]
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# none: tests use the same blocking client
