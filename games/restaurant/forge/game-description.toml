# game-description.toml -- Maison Cinq (5-star restaurant). Floor grid 40x24.
#
# The complete generation contract. Everything FIXED below is canon: the LLM
# must never contradict it. Everything in `open = [...]` is the LLM's to
# invent, grounded in the fixed facts, the quest scenario, and the time.
[game]
title = "Maison Cinq"
setting = "modern"
languages = ["english", "french", "spanish", "arabic"]
default_horizon = 1000.0
default_implication = 0.7

[time]
current = "Friday dinner rush, 8pm"
slots = ["6pm first seating", "8pm dinner rush", "10:30pm last seating"]

[generation]
seed = 5
cost_tier = "medium"

# Fixed geography. Coords are [x, y] on the 40x24 floor; descriptions ground
# every generated story, so they must stay vivid and truthful.
[locations.entrance]
coords = [2, 12]
description = "Glass entrance with a host stand, a velvet rope, and Theo's waitlist."

[locations.dining_hall]
coords = [20, 12]
description = "Candle-lit dining hall with six tables and a view of the open kitchen."

[locations.kitchen]
coords = [36, 20]
description = "Hot open kitchen behind glass; the pass faces the dining hall."

[locations.bar]
coords = [32, 4]
description = "Marble bar where waiting guests sip aperitifs under Priya's eye."

# Fixed places. Public facts are visible to anyone nearby; owners, interiors,
# and hidden details surface only with familiarity (localization) or ownership.
[places.t1]
coords = [14, 8]
kind = "table"
description = "Window table for two, the quietest seat in the house."
public = true

[places.t2]
coords = [14, 16]
kind = "table"
description = "Corner table for two, half-hidden behind the wine shelves."
public = true

[places.t3]
coords = [20, 8]
kind = "table"
description = "Center table for four, in the middle of the room's hum."
public = true

[places.t4]
coords = [20, 16]
kind = "table"
description = "Center table for four, best view of the open kitchen."
public = true

[places.t5]
coords = [26, 8]
kind = "table"
description = "Quiet table for two near the bar, loved by regulars."
public = true

[places.t6]
coords = [26, 16]
kind = "table"
description = "Chef's table with a kitchen view; Auguste sometimes presents dishes here himself."
public = true

[places.kitchen_room]
coords = [36, 20]
kind = "kitchen"
description = "The working kitchen, off-limits to guests."
owner = "auguste"
public = false
interior = "Ranges, the pass, and Auguste's recipe safe."
hidden = [{ text = "The safe holds the off-menu truffle recipe.", min_familiarity = 80 }]

[places.bar_counter]
coords = [32, 4]
kind = "bar"
description = "Six stools, top-shelf bottles, Priya's domain."
owner = "priya"
public = true
hidden = [{ text = "Priya keeps a bottle of 1998 Bordeaux under the counter for special guests.", min_familiarity = 60 }]

[places.wine_cellar]
coords = [34, 6]
kind = "cellar"
description = "A small cellar stair behind the bar, always locked."
owner = "priya"
public = false
interior = "Racked vintages and the tasting ledger."
hidden = [{ text = "The ledger notes which critic ordered what, and when.", min_familiarity = 80 }]

[places.office]
coords = [37, 22]
kind = "office"
description = "Celeste's tiny office above the kitchen noise."
owner = "celeste"
public = false
interior = "A desk, the reservation book, and tonight's review clippings."
hidden = [{ text = "The reservation book has one anonymous VIP entry: 'party of one, 10:30pm'.", min_familiarity = 80 }]

# NPC types. Fixed fields are canon per type; `open` lists what the LLM
# invents per NPC. Skills are the in-fiction craft the dialogue must honor:
# a sommelier talks wine, a chef talks the pass, guests talk their night.
[npc_types.manager]
description = "Runs the floor because the owner demands five stars and fears one bad review."
profile = "P12"
intellect = 4
languages = ["english", "french"]
localization = 2
body = { state = "healthy" }
wealth = 70
social_rank = 80
power = 60
health = 90
skills = [{ name = "Floor command", description = "Seats, comps, and rushes without ever raising her voice." },
          { name = "Review sense", description = "Spots critics and moods before they surface." }]
open = ["name", "age", "gender", "story", "short_memory", "long_memory",
        "localization_range"]
actions = ["comp_dish", "rush_order", "seat_next", "greet"]

[npc_types.host]
description = "Seats parties with a smile because the waitlist must never riot."
profile = "P02"
intellect = 3
languages = ["english", "spanish"]
localization = 1
body = { state = "healthy" }
wealth = 35
social_rank = 45
power = 30
health = 95
skills = [{ name = "Warm welcome", description = "Greets every arrival by making the wait feel short." },
          { name = "Waitlist craft", description = "Fits parties to tables without ever double-seating." }]
open = ["name", "age", "gender", "story", "short_memory", "long_memory",
        "localization_range"]
actions = ["seat_party", "greet"]

[npc_types.waiter]
description = "Works the floor for tips and fears the dinner rush."
profile = "P03"
intellect = 3
languages = ["english", "french", "spanish"]
localization = 0
localization_range = 14.0
body = { state = "healthy" }
wealth = 40
social_rank = 50
power = 35
health = 92
skills = [{ name = "Table service", description = "Takes orders, runs dishes, and never lets a glass run dry." },
          { name = "Menu memory", description = "Knows all four dishes, tonight's specials, and what to push." }]
open = ["name", "age", "gender", "story", "short_memory", "long_memory"]
actions = ["take_order", "serve_dish", "serve_next"]

[npc_types.chef]
description = "Commands the kitchen because the menu is art and the pass is law."
profile = "P05"
intellect = 4
languages = ["french", "english"]
localization = 2
body = { state = "healthy" }
wealth = 65
social_rank = 75
power = 85
health = 80
skills = [{ name = "The pass", description = "Fires and plates every dish to the second." },
          { name = "Mother sauces", description = "Thirty years of sauces; the risotto is personal." }]
open = ["name", "age", "gender", "story", "short_memory", "long_memory",
        "localization_range"]
actions = ["cook_dish", "cook_next"]

[npc_types.sommelier]
description = "Pairs wines because a great bottle forgives a slow kitchen."
profile = "P08"
intellect = 4
languages = ["french", "english", "spanish", "arabic"]
localization = 1
body = { state = "healthy" }
wealth = 60
social_rank = 70
power = 50
health = 88
skills = [{ name = "Pairings", description = "Matches every dish to a bottle the guest can afford to love." },
          { name = "Cellar lore", description = "Knows every rack in the cellar and the ledger's secrets." }]
open = ["name", "age", "gender", "story", "short_memory", "long_memory",
        "localization_range"]
actions = ["recommend_wine"]

[npc_types.customer]
description = "Hungry guests who want a perfect night and fear a ruined anniversary."
body = { state = "healthy" }
localization = 0
localization_range = 20.0
open = ["name", "age", "gender", "profile", "intellect", "languages", "wealth",
        "social_rank", "power", "health", "story", "skills", "short_memory",
        "long_memory"]
actions = ["order_dish", "order_drink", "pay_bill"]

# The living-communication contract (documentary for LLM readers): how NPCs
# listen, when they answer, when they initiate, and what they remember.
[communication]
listening = "Every NPC overhears speech within earshot and keeps it as short-term memory."
addressing = "A guest or staffer named by first name answers the speaker directly."
initiative = "The host welcomes arrivals; waiters check back mid-meal; long waits draw complaints; anyone near an idle player may start a conversation."
memory = "Overheard lines and served tables fold into short- and long-term memory continuously through the night."
